name: Bug report
description: Something in DotNetQuery does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please report security vulnerabilities privately instead -
        see [SECURITY.md](https://github.com/msynk/dotnet-query/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code (or a repository link) that shows the problem. A query's DevTools timeline helps too.
      render: csharp
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: Msynk.DotNetQuery.Blazor 0.9.0
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      multiple: true
      options:
        - Blazor Server
        - Blazor WebAssembly
        - Blazor Web App (Auto)
        - Blazor Hybrid
        - WPF
        - WinUI
        - Avalonia
        - MAUI
        - Uno Platform
        - Console / worker / ASP.NET Core
  - type: input
    id: runtime
    attributes:
      label: .NET version and OS
      placeholder: .NET 10.0.1 on Windows 11
