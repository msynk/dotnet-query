name: Docs

# Builds the documentation site (guides in docs/ + API reference generated from the XML docs) with DocFX and
# publishes it to GitHub Pages. Pull requests only build it, so broken docs fail review before they ship.
# One-time repository setting: Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', '.github/workflows/docs.yml']
  pull_request:
    branches: [main]
    paths: ['docs/**', 'src/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install DocFX
        run: dotnet tool update -g docfx

      - name: Build the site
        run: docfx docs/docfx.json

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
